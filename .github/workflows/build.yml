name: Build Weibo Manager

on:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (NSIS)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate platform icons
        run: pnpm tauri icon src-tauri/icons/logo.svg
      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app
      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Weibo Manager.app"
          DMG_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          hdiutil create -volname "Weibo Manager" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_DIR/Weibo Manager_0.1.0_${{ matrix.target == 'x86_64-apple-darwin' && 'x64' || 'aarch64' }}.dmg"
      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles nsis
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weibo-manager-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 14
